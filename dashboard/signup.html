<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masar · Create account</title><link rel="stylesheet" href="/assets/app.css"><style>
body.auth-page{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 20%,rgba(14,197,232,.18),transparent 28%),radial-gradient(circle at 85% 80%,rgba(255,166,0,.12),transparent 25%),linear-gradient(135deg,#020b1d,#071d43 52%,#123fc0);font-family:Inter,system-ui;color:#10233f;position:relative;overflow:hidden}
body.auth-page:before{content:"";position:absolute;width:700px;height:700px;border:1px solid rgba(34,211,238,.22);border-radius:50%;right:-260px;top:-260px;box-shadow:0 0 80px rgba(34,211,238,.12)}
.auth-shell{width:min(980px,calc(100% - 32px));display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.5);border-radius:28px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.35);position:relative;z-index:1}
.brand-panel{padding:42px;background:linear-gradient(160deg,#061633,#0c2a63);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.brand-panel img{width:190px;height:190px;object-fit:cover;border-radius:34px;box-shadow:0 12px 35px rgba(0,0,0,.35);border:1px solid rgba(34,211,238,.5)}.brand-panel h2{font-size:30px;margin:22px 0 6px}.brand-panel p{color:#dbeafe;margin:0}.gold-line{width:110px;height:5px;border-radius:20px;background:linear-gradient(90deg,#ffb000,#ff6b00);margin:22px 0}
.auth-card{padding:42px 48px}.auth-card h1{margin:0 0 8px;font-size:34px;letter-spacing:-.04em}.auth-card>p{color:#667085;margin:0 0 20px}.auth-card label{display:block;font-weight:800;font-size:14px;margin:14px 0 7px}.auth-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8e5;border-radius:11px;font:inherit;background:#fbfdff}.auth-card input:focus{outline:0;border-color:#2563eb;box-shadow:0 0 0 4px #dbeafe}.auth-card button{width:100%;margin-top:21px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#1675e8,#1749d1);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(23,73,209,.25)}.error{color:#b42318;margin-top:14px}.link{text-align:center;margin-top:20px;font-size:14px}.link a{color:#1559cf;font-weight:800;text-decoration:none}.link a:hover{text-decoration:underline}@media(max-width:720px){.auth-shell{grid-template-columns:1fr}.brand-panel{padding:28px}.brand-panel img{width:120px;height:120px;border-radius:24px}.brand-panel h2{font-size:24px;margin:12px 0 4px}.gold-line{margin:12px 0}.auth-card{padding:32px 26px}}
</style></head><body class="auth-page"><main class="auth-shell"><section class="brand-panel"><img src="/assets/masar-logo.png" alt="Masar logo"><h2>Masar Automation Platform</h2><div class="gold-line"></div><p>Connect. Automate. Scale.</p></section><section class="auth-card"><h1>Create your account</h1><p>Use your account to submit and track IT tickets.</p><form id="form"><label>Full name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><button>Create account</button></form><div id="error" class="error"></div><div class="link"><a href="/login">Already have an account? Sign in</a></div></section></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});const j=await r.json();if(!r.ok){document.getElementById('error').textContent=j.message;return}sessionStorage.setItem('token',j.token);location.href='/user/'})</script></body></html>
