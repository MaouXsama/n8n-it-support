<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Portal</title><style>body{margin:0;background:#f4f7fb;font-family:Inter,system-ui;color:#10233f}.top{background:linear-gradient(135deg,#102a56,#2563eb);color:#fff;padding:28px clamp(20px,6%,80px);display:flex;align-items:center;justify-content:space-between;gap:20px}.top button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;margin:0}.wrap{max-width:1200px;margin:auto;padding:32px clamp(20px,6%,80px)}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px #10233f0d}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.muted{color:#667085}.ticket{border-top:1px solid #e4e7ec;padding:16px 0}.ticket:first-child{border-top:0}.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}.status-completed{background:#dcfce7;color:#16723b}.status-open{background:#fff7d6;color:#a15c00}.status-in-progress{background:#e0efff;color:#1769aa}.status-cancelled{background:#eef2f6;color:#596579}.priority-high{background:#ffe4df;color:#c73524}.priority-normal{background:#e0efff;color:#1769aa}.priority-low{background:#eef2f6;color:#596579}</style><link rel="stylesheet" href="/dashboard-assets/app.css"></head><body><header class="top"><div class="masar-brand"><img class="masar-logo" src="/dashboard-assets/masar-logo.png" alt="Masar logo"><div class="masar-brand-copy"><h1 id="welcome">User Portal</h1><p>Submit and track your IT support tickets.</p></div></div><button id="signout">Sign out</button></header><main class="wrap"><div class="card"><h2>Open a ticket</h2><p class="muted">Describe your problem and n8n will assign the department, priority, and SLA.</p><a href="/create-ticket"><button>Create new ticket</button></a></div><div class="card"><h2>My tickets</h2><div id="tickets">Loading tickets...</div></div></main><script>document.getElementById("signout").addEventListener("click",()=>{sessionStorage.clear();location.href="/login"});const token=sessionStorage.getItem("token");if(!token)location.href="/login";const headers={Authorization:"Bearer "+token};async function load(){const me=await fetch("/api/auth/me",{headers}),mj=await me.json();if(!mj.user||mj.user.role!=="user"){location.href="/dashboard/";return}welcome.textContent="Welcome, "+mj.user.full_name;const r=await fetch("/api/tickets",{headers}),d=await r.json();if(!d.tickets.length){tickets.innerHTML='<p class="muted">No tickets yet.</p>';return}tickets.innerHTML=d.tickets.map(t=>{const status=String(t.status||"Open").toLowerCase().replace(/\s+/g,"-"),priority=String(t.priority||"Normal").toLowerCase();return `<article class="ticket"><strong>${t.ticket_id}</strong> · ${t.title}<br><span class="badge status-${status}">${t.status}</span> <span class="badge priority-${priority}">${t.priority||"Normal"}</span><p class="muted">Department: ${t.department} · Due: ${t.due_at?new Date(t.due_at).toLocaleString("en-US",{timeZone:"Asia/Riyadh"}):"-"}</p><button onclick="showComments('${t.ticket_id}')">View comments</button><div id="comments-${t.ticket_id}"></div></article>`}).join("")}async function showComments(id){const r=await fetch("/api/tickets/comments?ticket_id="+encodeURIComponent(id),{headers}),d=await r.json();document.getElementById("comments-"+id).innerHTML=d.comments.length?d.comments.map(c=>`<p class="muted">${c.comment}</p>`).join(""):'<p class="muted">No comments yet.</p>'}load();</script></body></html>
