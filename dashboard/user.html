<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Masar | My Tickets</title>
  <link rel="icon" href="/dashboard-assets/masar-favicon.svg" type="image/svg+xml">
  <style>
    body{margin:0;padding:0;background:#f5f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d}
    .topbar{background:linear-gradient(135deg,#102a56,#1d4ed8);color:#fff;padding:28px clamp(20px,5vw,64px);display:flex;align-items:center;justify-content:space-between;gap:20px}
    .topbar h1{margin:0;font-size:clamp(25px,3vw,38px);letter-spacing:-.03em}
    .topbar p{margin:8px 0 0;color:#dbeafe}
    .topbar button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;margin:0}
    main{max-width:1500px;margin:0 auto;padding:28px clamp(20px,5vw,64px) 56px}
    .card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px #10233f0d}
    .tickets-card h2{margin:0 0 16px}
    main>.intro-banner{margin:24px 0}
    button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}
    .muted{color:#667085}
    .ticket{border-top:1px solid #e4e7ec;padding:18px 2px}
    .ticket:first-child{border-top:0;padding-top:10px}
    .badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:800}
    .status-completed{background:#dcfce7;color:#16723b}
    .status-open{background:#fff7d6;color:#a15c00}
    .status-in-progress{background:#e0efff;color:#1769aa}
    .status-cancelled{background:#eef2f6;color:#596579}
    .priority-critical{background:#fee2e2;color:#991b1b}
    .priority-high{background:#ffe4df;color:#c73524}
    .priority-normal{background:#e0efff;color:#1769aa}
    .priority-low{background:#eef2f6;color:#596579}
    .user-pagination{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:18px;margin-top:10px;border-top:1px solid var(--line,#e4e7ec)}
    .pagination-controls{display:flex;align-items:center;gap:10px}
    .pagination-summary,.pagination-page{color:#64748b;font-size:13px;font-weight:700}
    .pagination-icon{width:38px!important;min-width:38px!important;height:38px!important;min-height:38px!important}
    .pagination-icon:disabled{cursor:not-allowed;opacity:.42;box-shadow:none!important}
    @media(max-width:720px){.user-pagination{align-items:center}.pagination-summary{width:100%}}
  </style>
  <link rel="stylesheet" href="/dashboard-assets/app.css">
</head>
<body>
  <header class="topbar">
    <div class="masar-brand">
      <img class="masar-logo" src="/dashboard-assets/masar-logo.png" alt="Masar logo">
      <div class="masar-brand-copy"><h1 id="welcome">User Portal</h1><p>Submit and track your IT support tickets.</p></div>
    </div>
    <button class="utility-button header-action account-trigger" id="account-menu-trigger" type="button" aria-label="Account settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></button>
    <button class="utility-button header-action header-signout" type="button" data-account-action="signout" aria-label="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"/><path d="m15 8 4 4-4 4M19 12H9"/></svg></button>
  </header>
  <main>
    <div class="card intro-banner intro-banner-with-action">
      <div class="intro-banner-content">
        <span class="intro-banner-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M18 19c0 1.1-.9 2-2 2h-3"/><rect x="3" y="13" width="4" height="6" rx="2"/><rect x="17" y="13" width="4" height="6" rx="2"/></svg></span>
        <div><h2>Open a ticket</h2><p class="muted">Describe your issue and Masar will automatically assign the appropriate support team, priority, and response deadline.</p></div>
      </div>
      <a class="primary-action" href="/create-ticket">Create new ticket</a>
    </div>
    <div class="card tickets-card">
      <h2>My tickets</h2>
      <div class="ticket-list" id="ticket-list"><div id="tickets">Loading tickets...</div></div>
      <div class="user-pagination">
        <div class="pagination-summary" id="ticket-range">Showing 0 tickets</div>
        <div class="pagination-controls">
          <button class="utility-button pagination-icon" id="ticket-first" type="button" aria-label="First tickets page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12M18 6l-6 6 6 6"/></svg></button>
          <button class="utility-button pagination-icon" id="ticket-prev" type="button" aria-label="Previous tickets page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <span class="pagination-page" id="ticket-page-label">Page 1 of 1</span>
          <button class="utility-button pagination-icon" id="ticket-next" type="button" aria-label="Next tickets page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          <button class="utility-button pagination-icon" id="ticket-last" type="button" aria-label="Last tickets page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6v12M6 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </div>
  </main>
  <script>
    const token=sessionStorage.getItem('token');
    if(!token) location.href='/login';
    const headers={Authorization:'Bearer '+token};
    let ticketPage=1;
    const ticketPageSize=5;
    let ticketTotalPages=1;

    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));}

    function renderTickets(data){
      const rows=data.tickets||[];
      const total=Number(data.total)||0;
      ticketPage=Number(data.page)||1;
      ticketTotalPages=Number(data.totalPages)||1;
      const start=(ticketPage-1)*ticketPageSize;
      document.getElementById('ticket-range').textContent=total?`Showing ${start+1}–${start+rows.length} of ${total} tickets`:'Showing 0 tickets';
      document.getElementById('ticket-page-label').textContent=`Page ${ticketPage} of ${ticketTotalPages}`;
      document.getElementById('ticket-first').disabled=ticketPage<=1;
      document.getElementById('ticket-prev').disabled=ticketPage<=1;
      document.getElementById('ticket-next').disabled=ticketPage>=ticketTotalPages;
      document.getElementById('ticket-last').disabled=ticketPage>=ticketTotalPages;
      if(!rows.length){document.getElementById('tickets').innerHTML='<p class="muted">No tickets yet.</p>';return;}
      document.getElementById('tickets').innerHTML=rows.map(ticket=>{
        const status=String(ticket.status||'Open').toLowerCase().replace(/\s+/g,'-');
        const priority=String(ticket.priority||'Normal').toLowerCase();
        const messages={Open:'Your ticket has been received and assigned to the appropriate support team for review.','In Progress':'The assigned support team is currently working on your ticket. You will receive an email when it is completed.',Completed:'Your ticket has been completed. A completion notification has been sent to your email. Thank you for using Masar IT Support.',Cancelled:'This ticket has been cancelled. Please create a new ticket if you still require assistance.'};
        const due=ticket.due_at?new Date(ticket.due_at).toLocaleString('en-US',{timeZone:'Asia/Riyadh'}):'—';
        return `<article class="ticket"><strong>${escapeHtml(ticket.ticket_id)}</strong> · ${escapeHtml(ticket.title)}<br><span class="badge status-${status}">${escapeHtml(ticket.status)}</span> <span class="badge priority-${priority}">${escapeHtml(ticket.priority||'Normal')}</span><p class="muted">Assigned Team: ${escapeHtml(ticket.department||'—')} · Due: ${escapeHtml(due)}</p><div class="ticket-status-message message-${status}">${messages[ticket.status]||messages.Open}</div></article>`;
      }).join('');
    }

    async function loadTickets(focusList=false){
      const list=document.getElementById('ticket-list');
      try{
        const response=await fetch(`/api/tickets?page=${ticketPage}&limit=${ticketPageSize}&sort=created-desc`,{headers});
        if(!response.ok) throw new Error('Tickets could not be loaded');
        renderTickets(await response.json());
        if(focusList) list.closest('.card').scrollIntoView({behavior:'smooth',block:'start'});
      }catch(error){document.getElementById('tickets').innerHTML=`<p class="muted">${escapeHtml(error.message)}. Please refresh the page.</p>`;}
    }

    async function initialize(){
      const response=await fetch('/api/auth/me',{headers});
      const data=await response.json();
      if(!data.user||data.user.role!=='user'){location.href='/dashboard/';return;}
      document.getElementById('welcome').textContent='Welcome, '+data.user.full_name;
      await loadTickets();
    }

    document.getElementById('ticket-first').addEventListener('click',()=>{if(ticketPage>1){ticketPage=1;loadTickets(true);}});
    document.getElementById('ticket-prev').addEventListener('click',()=>{if(ticketPage>1){ticketPage-=1;loadTickets(true);}});
    document.getElementById('ticket-next').addEventListener('click',()=>{if(ticketPage<ticketTotalPages){ticketPage+=1;loadTickets(true);}});
    document.getElementById('ticket-last').addEventListener('click',()=>{if(ticketPage<ticketTotalPages){ticketPage=ticketTotalPages;loadTickets(true);}});
    initialize();
  </script>
  <script src="/dashboard-assets/account-menu.js"></script>
</body>
</html>
