<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New IT Ticket</title><style>body{margin:0;background:#f4f7fb;font-family:Inter,system-ui,sans-serif;color:#10233f}.top{background:linear-gradient(135deg,#102a56,#2563eb);color:#fff;padding:28px 6%}.wrap{max-width:850px;margin:auto;padding:30px 6%}.card{background:#fff;border:1px solid #dfe6f0;border-radius:18px;padding:30px;box-shadow:0 12px 32px #10233f12}h1{margin:0 0 8px;letter-spacing:-.04em}h2{margin-top:0}.sub{color:#dbeafe}.hint{color:#667085}.field{margin:20px 0}label{display:block;font-weight:800;margin-bottom:8px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #cfd8e5;border-radius:10px;padding:14px;font:inherit}textarea{min-height:170px;resize:vertical}input:focus,textarea:focus{outline:3px solid #dbeafe;border-color:#2563eb}button{border:0;border-radius:10px;padding:14px 20px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.links{margin-top:20px}.links a{color:#2563eb;text-decoration:none;font-weight:700}.result{margin-top:18px;padding:14px;border-radius:10px;white-space:pre-wrap}.success{background:#ecfdf3;color:#027a48}.error{background:#fef3f2;color:#b42318}</style><link rel="stylesheet" href="/assets/app.css"></head><body><header class="top"><div class="masar-brand"><img class="masar-logo" src="/assets/masar-logo.png" alt="Masar logo"><div class="masar-brand-copy"><h1>New IT support ticket</h1><div id="welcome" class="sub">Loading account...</div></div></div></header><main class="wrap"><section class="card"><h2>Describe your problem</h2><p class="hint">Our automation will determine the department, priority, and SLA.</p><form id="form"><div class="field"><label for="title">Problem title</label><input id="title" name="title" required placeholder="VPN connection problem"></div><div class="field"><label for="description">Description</label><textarea id="description" name="description" required placeholder="Explain what happened and when it started..."></textarea></div><button>Submit ticket</button></form><div id="result"></div><div class="links"><a href="/user/">← Back to my tickets</a></div></section></main><script>const token=sessionStorage.getItem('token');if(!token)location.href='/login';const headers={Authorization:'Bearer '+token};let requesterEmail='';fetch('/api/auth/me',{headers}).then(r=>r.json()).then(j=>{if(!j.user||j.user.role!=='user'){location.href='/dashboard/';return}requesterEmail=j.user.email;document.getElementById('welcome').textContent='Welcome, '+j.user.full_name+' · '+j.user.email});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const result=document.getElementById('result');const data={title:document.getElementById('title').value,description:document.getElementById('description').value,requester:requesterEmail};result.className='result';result.textContent='Submitting ticket...';try{const r=await fetch('/webhook/ticket-intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok||!j.success)throw Error(j.message||'Submission failed');result.className='result success';result.textContent=`Ticket ${j.ticket.ticket_id} submitted successfully.\nDepartment: ${j.ticket.department}\nPriority: ${j.ticket.priority}\nSLA: ${j.ticket.sla_hours} hours`;document.getElementById('form').reset()}catch(err){result.className='result error';result.textContent='Unable to submit ticket: '+err.message}});</script></body></html>
